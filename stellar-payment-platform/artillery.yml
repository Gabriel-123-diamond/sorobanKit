config:
  target: "{{ $processEnvironment.TARGET_URL || 'http://localhost:5000' }}"
  phases:
    - duration: 60
      arrivalCount: 50
      name: "Load test read-only endpoints over 60 seconds"

scenarios:
  - name: "Read-only endpoints scenario"
    flow:
      - get:
          url: "/health"
      - get:
          url: "/federation"
      - get:
          url: "/lookup?search=test"
      - get:
          url: "/users"

  - name: "Authenticated admin export scenario"
    flow:
      - get:
          url: "/transactions/export"
          headers:
            x-api-key: "{{ $processEnvironment.ADMIN_API_KEY }}"
