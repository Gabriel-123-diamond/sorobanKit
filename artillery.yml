config:
  target: "http://localhost:5000"
  phases:
    - duration: 60
      arrivalRate: 100
      rampTo: 100
      name: "Scale to 100 concurrent virtual users"
  defaults:
    headers:
      accept: "application/json"
  variables:
    apiKey: "{{ $processEnvironment.TEST_API_KEY }}"
before:
  flow:
    - log: "Running load tests with TEST_API_KEY from environment"
scenarios:
  - name: "Address lookup load"
    weight: 3
    flow:
      - get:
          url: "/lookup"
          qs:
            address: "GAPUQZH3WZUXHEMUGZN5ZYU4D4GHCFEMOGUINU6MF345GBD2QXNYYIEQ"
  - name: "Federation lookup load"
    weight: 1
    flow:
      - get:
          url: "/federation"
          qs:
            q: "alice*localhost"
            type: "name"
  - name: "Health check load"
    weight: 1
    flow:
      - get:
          url: "/health"
  - name: "Admin routing stats load"
    weight: 1
    flow:
      - get:
          url: "/admin/stats/routing"
          headers:
            X-Api-Key: "{{ apiKey }}"
  - name: "Admin audit logs load"
    weight: 1
    flow:
      - get:
          url: "/admin/audit-logs"
          headers:
            X-Api-Key: "{{ apiKey }}"
  - name: "Admin transactions export load"
    weight: 1
    flow:
      - get:
          url: "/transactions/export"
          headers:
            X-Api-Key: "{{ apiKey }}"
