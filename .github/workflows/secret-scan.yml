name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so we can scan the PR commit range
          # (base..head) rather than only the current HEAD.
          fetch-depth: 0

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "since_commit=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "head_commit=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "Scanning PR commit range ${BASE_SHA}..${HEAD_SHA}"
          else
            # On push, scan the commits introduced by this push.
            BEFORE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              # New branch / no prior commit: fall back to scanning full history.
              BEFORE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}" | tail -n 1)"
            fi
            echo "since_commit=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
            echo "head_commit=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "Scanning push commit range ${BEFORE_SHA}..${HEAD_SHA}"
          fi

      - name: TruffleHog scan (commit range)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Scan the full commit range so secrets added and then deleted
          # within the same PR are still detected.
          base: ${{ steps.range.outputs.since_commit }}
          head: ${{ steps.range.outputs.head_commit }}
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-ignore.txt
