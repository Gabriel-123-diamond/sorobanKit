databases:
  - name: stellar-tags-db
    databaseName: stellar_tags
    user: stellar_tags
    plan: basic-256mb

services:
  - type: web
    name: stellar-tags-api
    runtime: docker
    dockerfilePath: ./Dockerfile-backend
    dockerContext: .
    autoDeployTrigger: commit
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_DIR
        value: /app/logs
      # Use strict migration policy in production: if the schema is not fully
      # migrated, the service exits before binding a port, making pending
      # migrations a deployment blocker (failing the health check) rather than
      # serving traffic with an out-of-sync schema.
      - key: MIGRATION_POLICY
        value: strict
      - key: DATABASE_URL
        fromDatabase:
          name: stellar-tags-db
          property: connectionString